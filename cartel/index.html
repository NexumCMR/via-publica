<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<script>document.documentElement.className="js";</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cartel — Masa Ideas</title>
<meta name="theme-color" content="#0E0F12">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --tinta:#0E0F12; --tinta2:#17181D; --papel:#F1F2F4; --papel2:#FFFFFF;
    --azul:#1F3CFF; --azul-d:#1730C7; --oro:#E8A93C; --verde:#12A150;
    --gris:#71747C; --gris-l:#A8ABB3; --linea:rgba(14,15,18,.10); --linea-d:rgba(241,242,244,.14);
    --disp:'Bricolage Grotesque',system-ui,sans-serif;
    --sans:'Plus Jakarta Sans',system-ui,-apple-system,sans-serif;
    --mono:'Space Mono',ui-monospace,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
  body{background:var(--papel);color:var(--tinta);font-family:var(--sans);line-height:1.5;padding-bottom:96px;overflow-x:hidden}
  .wrap{max-width:620px;margin:0 auto;padding:0 22px}
  .mono{font-family:var(--mono);text-transform:uppercase;letter-spacing:.12em}

  /* ---------- nav ---------- */
  .nav{position:absolute;top:0;left:0;right:0;z-index:5;display:flex;align-items:center;
       justify-content:space-between;gap:12px;max-width:620px;margin:0 auto;padding:20px 22px}
  .logo{display:flex;align-items:center;gap:10px;color:#fff}
  .logo i{width:30px;height:30px;border-radius:9px;background:var(--azul);display:grid;place-items:center;flex:0 0 30px}
  .logo i::before{content:"";width:15px;height:10px;background:#fff;border-radius:2px;box-shadow:0 7px 0 -3px #fff}
  .logo span{font-family:var(--disp);font-weight:800;font-size:15px;letter-spacing:-.01em}
  .tag{font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:#fff;
       background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.26);
       backdrop-filter:blur(6px);padding:6px 11px;border-radius:999px;white-space:nowrap}

  /* ---------- hero ---------- */
  .hero{position:relative;height:100svh;min-height:560px;display:flex;align-items:flex-end;overflow:hidden;background:var(--tinta)}
  .hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;
            transform:none}
  @keyframes zoom{to{transform:scale(1)}}
  .hero::after{content:"";position:absolute;inset:0;
    background:linear-gradient(180deg,rgba(14,15,18,.38) 0%,rgba(14,15,18,0) 20%,rgba(14,15,18,0) 54%,rgba(14,15,18,.62) 72%,var(--tinta) 88%)}
  .hero-in{position:relative;z-index:2;width:100%;max-width:620px;margin:0 auto;padding:0 22px 34px;color:#fff}
  .badge{display:inline-flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11px;
         letter-spacing:.14em;background:var(--oro);color:#1B1206;padding:7px 12px;border-radius:999px}
  .eyebrow{font-family:var(--mono);font-size:11.5px;letter-spacing:.2em;color:var(--gris-l);margin-top:20px}
  .hero h1{font-family:var(--disp);font-weight:800;font-size:clamp(46px,15vw,78px);line-height:.88;
           letter-spacing:-.035em;margin-top:10px}
  .hero h1 b{display:block;font-weight:800;color:#fff}
  .hero p{margin-top:14px;font-size:16px;color:#D2D5DC;max-width:34ch}
  .scroll{margin-top:24px;display:flex;align-items:center;gap:9px;font-family:var(--mono);
          font-size:10.5px;letter-spacing:.16em;color:var(--gris-l)}
  .scroll i{width:1px;height:26px;background:linear-gradient(180deg,var(--gris-l),transparent);animation:drop 1.9s ease-in-out infinite}
  @keyframes drop{0%,100%{opacity:.3;transform:translateY(-3px)}50%{opacity:1;transform:translateY(3px)}}

  /* ---------- ticker ---------- */
  .ticker{background:var(--tinta);color:#fff;border-top:1px solid var(--linea-d);
          border-bottom:1px solid var(--linea-d);overflow:hidden;padding:13px 0}
  .track{display:flex;width:max-content;animation:slide 26s linear infinite}
  .track span{font-family:var(--mono);font-size:12px;letter-spacing:.16em;padding:0 20px;white-space:nowrap}
  .track span::after{content:"◆";color:var(--azul);margin-left:20px;font-size:9px;vertical-align:middle}
  @keyframes slide{to{transform:translateX(-50%)}}

  /* ---------- stat ---------- */
  .stat{background:var(--azul);color:#fff;padding:44px 0 40px}
  .stat .n{font-family:var(--disp);font-weight:800;font-size:clamp(54px,17vw,88px);line-height:.9;letter-spacing:-.04em}
  .stat .l{font-family:var(--mono);font-size:12px;letter-spacing:.2em;margin-top:12px;color:#C9D0FF}
  .stat .d{margin-top:18px;padding-top:18px;border-top:1px solid rgba(255,255,255,.22);font-size:16px;max-width:36ch}
  .stat .d b{font-weight:700}

  /* ---------- reveal ---------- */
  .rev{opacity:1;transform:none}
  .js .rev{opacity:0;transform:translateY(18px);transition:opacity .6s ease,transform .6s ease}
  .js .rev.in{opacity:1;transform:none}

  /* ---------- secciones ---------- */
  .sec{padding-top:52px}
  .kicker{font-family:var(--mono);font-size:11px;letter-spacing:.2em;color:var(--azul)}
  h2{font-family:var(--disp);font-weight:800;font-size:clamp(27px,7vw,34px);line-height:1.02;
     letter-spacing:-.025em;margin-top:9px}
  .lede{color:var(--gris);font-size:15.5px;margin-top:10px;max-width:44ch}

  /* argumentos */
  .args{display:grid;gap:10px;margin-top:22px}
  .arg{background:var(--papel2);border:1px solid var(--linea);border-radius:16px;padding:18px 18px 17px;
       display:flex;gap:14px;align-items:flex-start}
  .arg .ic{width:36px;height:36px;flex:0 0 36px;border-radius:11px;background:rgba(31,60,255,.09);
           display:grid;place-items:center;color:var(--azul)}
  .arg .ic svg{width:19px;height:19px}
  .arg b{display:block;font-size:16px;font-weight:700}
  .arg p{font-size:14px;color:var(--gris);margin-top:3px}

  /* galería */
  .gal{margin-top:22px;display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;
       padding:0 22px 4px;margin-left:-22px;margin-right:-22px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .gal::-webkit-scrollbar{display:none}
  .slide{flex:0 0 84%;max-width:440px;scroll-snap-align:center;border-radius:18px;overflow:hidden;
         background:var(--tinta2);position:relative;aspect-ratio:3/2}
  .slide img{width:100%;height:100%;object-fit:cover;object-position:center;display:block}
  .slide figcaption{position:absolute;left:0;right:0;bottom:0;padding:26px 16px 14px;color:#fff;font-size:13.5px;
    font-weight:500;background:linear-gradient(180deg,rgba(14,15,18,0),rgba(14,15,18,.82))}
  .slide em{position:absolute;top:12px;left:12px;font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;
    font-style:normal;background:rgba(14,15,18,.62);backdrop-filter:blur(4px);color:#fff;padding:5px 9px;border-radius:999px}
  .galhint{font-size:13px;color:var(--gris);margin-top:12px}

  /* datos */
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:22px}
  .tile{background:var(--papel2);border:1px solid var(--linea);border-radius:16px;padding:16px}
  .tile dt{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;color:var(--gris)}
  .tile dd{font-family:var(--disp);font-weight:800;font-size:23px;letter-spacing:-.02em;margin-top:6px}
  .tile dd small{font-family:var(--sans);font-size:13px;font-weight:600;color:var(--gris);letter-spacing:0}

  /* disponibilidad */
  .avail{margin-top:22px;background:var(--tinta);color:#fff;border-radius:20px;padding:24px 22px}
  .avail .top{display:flex;align-items:center;gap:9px;font-family:var(--mono);font-size:11px;letter-spacing:.16em;color:var(--oro)}
  .avail .top i{width:8px;height:8px;border-radius:50%;background:var(--oro);
                box-shadow:0 0 0 0 rgba(232,169,60,.55);animation:pulse 2.4s ease-out infinite}
  @keyframes pulse{70%{box-shadow:0 0 0 11px rgba(232,169,60,0)}100%{box-shadow:0 0 0 0 rgba(232,169,60,0)}}
  .avail h3{font-family:var(--disp);font-weight:800;font-size:clamp(24px,6.4vw,31px);line-height:1.06;
            letter-spacing:-.025em;margin-top:13px}
  .avail h3 b{color:var(--oro)}
  .rail{height:7px;background:rgba(255,255,255,.13);border-radius:99px;margin-top:20px;overflow:hidden}
  .rail i{display:block;height:100%;width:0;border-radius:99px;
          background:linear-gradient(90deg,var(--oro),#F7D28C);transition:width 1.2s cubic-bezier(.2,.7,.3,1)}
  .rail-l{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10px;
          letter-spacing:.12em;color:var(--gris-l);margin-top:9px}
  .avail p{margin-top:16px;font-size:14.5px;color:#C7CAD2}
  .avail p b{color:#fff}

  /* precio */
  .price{margin-top:12px;background:var(--papel2);border:1px solid var(--linea);border-radius:20px;padding:24px 22px}
  .price .l{font-family:var(--mono);font-size:11px;letter-spacing:.18em;color:var(--gris)}
  .price .v{font-family:var(--disp);font-weight:800;font-size:clamp(34px,9.5vw,46px);letter-spacing:-.035em;margin-top:8px}
  .price .v span{font-family:var(--sans);font-size:15px;font-weight:600;color:var(--gris);letter-spacing:0}
  .price small{display:block;font-size:13px;color:var(--gris);margin-top:10px}

  /* ubicación + qr */
  .map{margin-top:22px;background:var(--papel2);border:1px solid var(--linea);border-radius:20px;padding:22px}
  .map .a{font-size:17px;font-weight:600;line-height:1.35}
  .map .a span{display:block;font-size:14px;font-weight:400;color:var(--gris);margin-top:4px}
  .btn{display:inline-flex;align-items:center;gap:9px;margin-top:16px;padding:13px 19px;border-radius:12px;
       background:var(--tinta);color:#fff;text-decoration:none;font-size:14.5px;font-weight:700;
       transition:background .2s ease}
  .btn:hover{background:var(--azul)}
  .btn svg{width:17px;height:17px}
  .share{margin-top:12px;background:var(--papel2);border:1px solid var(--linea);border-radius:20px;
         padding:20px;display:flex;gap:18px;align-items:center}
  .share img{width:96px;height:96px;flex:0 0 96px;border-radius:12px;background:#fff;padding:6px;border:1px solid var(--linea)}
  .share b{font-size:16px;font-weight:700}
  .share p{font-size:13.5px;color:var(--gris);margin-top:4px}
  .wa-share{display:inline-flex;align-items:center;gap:8px;margin-top:12px;padding:11px 16px;border-radius:10px;
        background:var(--azul);color:#fff;border:0;font-size:14px;font-weight:700;cursor:pointer;text-decoration:none}
  .wa-share svg{width:16px;height:16px}
  .copy{margin-left:8px;margin-top:12px;background:none;border:1px solid var(--linea);border-radius:10px;color:var(--tinta);
        font-family:var(--mono);font-size:11px;letter-spacing:.12em;padding:10px 14px;cursor:pointer;
        transition:border-color .2s ease,color .2s ease}
  .copy:hover{border-color:var(--azul);color:var(--azul)}

  footer{margin-top:52px;padding:26px 0 10px;border-top:1px solid var(--linea);font-size:13.5px;color:var(--gris)}
  footer b{color:var(--tinta);font-weight:700}

  .btn-wa-grande{display:flex;flex-direction:column;gap:3px;align-items:center;text-align:center;
    background:var(--azul);color:#fff;text-decoration:none;padding:22px 20px;border-radius:20px;
    box-shadow:0 10px 26px rgba(31,60,255,.26)}
  .btn-wa-grande b{font-family:var(--disp);font-weight:800;font-size:21px;letter-spacing:-.02em}
  .btn-wa-grande span{font-size:14.5px;opacity:.92}

  /* cta fija */
  .cta{position:fixed;left:0;right:0;bottom:0;z-index:9;padding:14px 22px calc(14px + env(safe-area-inset-bottom));
       background:linear-gradient(180deg,rgba(241,242,244,0),rgba(241,242,244,.96) 36%)}
  .cta a{display:flex;align-items:center;justify-content:center;gap:11px;max-width:576px;margin:0 auto;
         background:var(--azul);color:#fff;text-decoration:none;padding:17px 20px;border-radius:14px;
         font-size:16.5px;font-weight:800;letter-spacing:-.01em;box-shadow:0 12px 28px rgba(31,60,255,.32)}
  .cta a:active{transform:translateY(1px)}
  .cta svg{width:21px;height:21px;flex:0 0 21px}

  :focus-visible{outline:2px solid var(--azul);outline-offset:3px}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}
    .rev{opacity:1;transform:none}}
  @media (min-width:620px){.grid{grid-template-columns:repeat(3,1fr)}.args{grid-template-columns:repeat(3,1fr)}}
</style>
<style>
  .cargando{min-height:70svh;display:grid;place-items:center;color:var(--gris);font-size:15px;text-align:center;padding:30px}
  .js .rev{opacity:1;transform:none}
</style>
</head>
<body>
<div id="app"><div class="cargando">Cargando la ficha…</div></div>

<script>
(function(){
  var API="https://vdxkgywwcxluklvhzmor.supabase.co/rest/v1";
  var LLAVE="sb_publishable_Pde178b3hSbn8bjirUR9Lw_PsaJiUC_";
  var TEL="5491161112938";

  var m=location.pathname.match(/cartel\/([^\/?#]+)/);
  var COD=(m&&m[1])||new URLSearchParams(location.search).get("c")||"";
  var app=document.getElementById("app");

  function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
  function plata(n){ return "$"+Number(n||0).toLocaleString("es-AR",{maximumFractionDigits:0}); }
  function fecha(d){ if(!d) return ""; var p=String(d).split("-");
    var mm=["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
    return Number(p[2])+" de "+mm[Number(p[1])-1]+" de "+p[0]; }

  function pedir(ruta){
    return fetch(API+ruta,{headers:{apikey:LLAVE,Authorization:"Bearer "+LLAVE}}).then(function(r){
      if(!r.ok) throw new Error("consulta"); return r.json(); });
  }

  if(!COD){ app.innerHTML='<div class="cargando">No se indicó ningún cartel.</div>'; return; }

  Promise.all([
    pedir("/masa_carteles?codigo=eq."+encodeURIComponent(COD)+"&select=*"),
    pedir("/masa_fotos?codigo=eq."+encodeURIComponent(COD)+"&select=*&order=orden.asc")
  ]).then(function(res){
    var c=res[0][0], fotos=res[1]||[];
    if(!c){ app.innerHTML='<div class="cargando">Este cartel todavía no está publicado.</div>'; return; }
    dibujar(c,fotos);
    fetch(API+"/masa_visitas",{method:"POST",
      headers:{apikey:LLAVE,Authorization:"Bearer "+LLAVE,"Content-Type":"application/json"},
      body:JSON.stringify({codigo:COD,origen:document.referrer||null})}).catch(function(){});
  }).catch(function(){
    app.innerHTML='<div class="cargando">No se pudo cargar la ficha. Probá de nuevo en un momento.</div>';
  });

  function dibujar(c,fotos){
    document.title=(c.nombre||("Cartel "+c.codigo))+" — Masa Ideas";
    var portada=(fotos.filter(function(f){return f.portada;})[0]||fotos[0]||{}).url||"";
    var libre=c.estado!=="Ocupado";
    var dias=null;
    if(c.disponible_desde){ dias=Math.ceil((new Date(c.disponible_desde)-new Date())/86400000); }

    var chips=[];
    if(c.impactos) chips.push(Number(c.impactos).toLocaleString("es-AR")+" impactos por semana");
    if(c.medidas) chips.push(c.medidas+" de pantalla");
    if(c.iluminado) chips.push("Iluminado todas las noches");
    if(c.localidad) chips.push("En "+c.localidad);
    if(c.visual) chips.push("Visual "+String(c.visual).toLowerCase());
    if(libre) chips.push("Disponible");

    var slides=fotos.map(function(f,i){
      return '<figure class="slide"><img src="'+esc(f.url)+'" alt="'+esc(f.epigrafe||"")+'" loading="'+(i<2?"eager":"lazy")+'">'+
             '<em>'+(i+1)+"/"+fotos.length+'</em>'+
             (f.epigrafe?'<figcaption>'+esc(f.epigrafe)+'</figcaption>':'')+'</figure>';
    }).join("");

    var msg="Hola! Me interesa el cartel COD "+c.codigo+(c.nombre?" — "+c.nombre:"")+". ¿Me pasás más información?";
    var wa="https://wa.me/"+TEL+"?text="+encodeURIComponent(msg);
    var txtCompartir="Te paso este espacio: "+(c.nombre||("COD "+c.codigo))+". Ficha completa: "+location.href;
    var compartir="https://api.whatsapp.com/send?text="+encodeURIComponent(txtCompartir);

    var precio = c.mostrar_precio===false
      ? '<div class="v">Consultar <span>precio</span></div><small>Escribinos por WhatsApp y te pasamos el valor actualizado de este espacio.</small>'
      : '<div class="v">'+plata(c.precio)+' <span>+ IVA</span></div><small>Producción y colocación de la gráfica se cotizan aparte, según la campaña.</small>';

    app.innerHTML=
    '<header class="nav"><div class="logo"><i></i><span>Masa Ideas</span></div></header>'+
    '<section class="hero">'+(portada?'<img src="'+esc(portada)+'" alt="'+esc(c.nombre||"")+'">':'')+
      '<div class="hero-in">'+
        (!libre&&c.disponible_desde?'<span class="badge">Se libera el '+esc(fecha(c.disponible_desde))+'</span>':
         (libre?'<span class="badge">Disponible ahora</span>':''))+
        '<p class="eyebrow">'+esc([c.tipo||"Espectacular",c.localidad].filter(Boolean).join(" · "))+'</p>'+
        '<h1>'+esc(c.nombre||("Cartel "+c.codigo))+'</h1>'+
        (c.direccion?'<p>'+esc(c.direccion)+'</p>':'')+
        '<div class="scroll"><i></i> Deslizá para ver</div>'+
      '</div></section>'+
    (chips.length>=2?'<div class="ticker"><div class="track">'+chips.concat(chips).map(function(x){return "<span>"+esc(x)+"</span>";}).join("")+'</div></div>':'')+
    (c.impactos?'<section class="stat"><div class="wrap"><div class="n">'+Number(c.impactos).toLocaleString("es-AR")+'</div>'+
      '<div class="l">impactos por semana</div><p class="d">Cerca de <b>'+Math.round(c.impactos/7).toLocaleString("es-AR")+
      ' personas por día</b> pasan frente a este cartel.</p></div></section>':'')+
    '<main class="wrap">'+
      (fotos.length?'<section class="sec rev"><p class="kicker">La vista real</p><h2>Así lo ve el conductor</h2></section>':'')+
    '</main>'+
    (fotos.length?'<div class="wrap"><div class="gal">'+slides+'</div></div>':'')+
    '<main class="wrap">'+
      '<section class="sec rev"><p class="kicker">Ficha técnica</p><h2>Los números del espacio</h2><dl class="grid">'+
        (c.medidas?'<div class="tile"><dt>Medidas</dt><dd>'+esc(c.medidas)+'</dd></div>':'')+
        (c.superficie?'<div class="tile"><dt>Superficie</dt><dd>'+esc(String(c.superficie).replace(".",","))+' <small>m²</small></dd></div>':'')+
        (c.tipo?'<div class="tile"><dt>Tipo</dt><dd>'+esc(c.tipo)+'</dd></div>':'')+
        '<div class="tile"><dt>Iluminación</dt><dd>'+(c.iluminado?"Sí":"No")+'</dd></div>'+
        (c.visual?'<div class="tile"><dt>Visual</dt><dd>'+esc(c.visual)+'</dd></div>':'')+
        (c.localidad?'<div class="tile"><dt>Localidad</dt><dd>'+esc(c.localidad)+'</dd></div>':'')+
      '</dl></section>'+
      '<section class="sec rev"><a class="btn-wa-grande" href="'+wa+'" target="_blank" rel="noopener">'+
        '<b>¿Te interesa este espacio?</b><span>Escribinos por WhatsApp</span></a></section>'+
      '<section class="sec rev"><p class="kicker">Disponibilidad</p><h2>'+(libre?"Disponible para tomar":"Reservalo antes de que quede libre")+'</h2>'+
        '<div class="avail"><div class="top"><i></i> '+(libre?"Libre":"Ocupado hoy")+'</div>'+
        (c.disponible_desde&&!libre?'<h3>Se libera el <b>'+esc(fecha(c.disponible_desde))+'</b></h3>':'<h3>Se puede tomar <b>ya mismo</b></h3>')+
        (dias&&dias>0?'<p>Faltan <b>'+dias+' días</b>. Se puede reservar desde ahora.</p>':'')+
        '</div><div class="price">'+precio+'</div></section>'+
      '<section class="sec rev"><p class="kicker">Ubicación</p><h2>Dónde está</h2><div class="map">'+
        '<p class="a">'+esc(c.direccion||"")+(c.localidad?'<span>'+esc(c.localidad)+'</span>':'')+'</p>'+
        '<a class="btn" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query='+
          encodeURIComponent((c.direccion||"")+", "+(c.localidad||"")+", Buenos Aires")+'">Abrir en el mapa</a></div>'+
        '<div class="share"><div><b>Pasá esta ficha</b><p>Mandásela a quien decide.</p>'+
        '<a class="wa-share" id="compartir" href="'+compartir+'" target="_blank" rel="noopener">Enviar por WhatsApp</a></div></div>'+
      '</section>'+
      '<footer><b>Masa Ideas</b> · Publicidad en vía pública<br>Consultas y reservas por WhatsApp.</footer>'+
    '</main>'+
    '<div class="cta"><a href="'+wa+'" target="_blank" rel="noopener">Consultar por WhatsApp</a></div>';

    var bc=document.getElementById("compartir");
    if(bc) bc.addEventListener("click",function(ev){
      if(navigator.share){ ev.preventDefault();
        navigator.share({title:c.nombre||("Cartel "+c.codigo),text:txtCompartir,url:location.href}).catch(function(){}); }
    });

    if("IntersectionObserver" in window){
      var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target);}});},{threshold:.14});
      document.querySelectorAll(".rev").forEach(function(el){io.observe(el);});
    }
  }
})();
</script>
</body>
</html>

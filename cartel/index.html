<!DOCTYPE html>

<title>Cartel — Masa Ideas</title>
<meta name="theme-color" content="#0A0A0C">
<meta property="og:title" content="Espacio publicitario — Masa Ideas">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --negro:#0A0A0C; --negro2:#141419; --papel:#F2F0EB; --blanco:#fff;
    --oro:#E8A93C; --oro-cl:#F7D89A; --verde:#12A150; --rojo:#D64545;
    --gris:#6F7178; --gris-cl:#A9ABB2; --linea:rgba(10,10,12,.10); --linea-o:rgba(242,240,235,.14);
    --disp:'Bricolage Grotesque',system-ui,sans-serif;
    --sans:'Plus Jakarta Sans',system-ui,sans-serif;
    --mono:'Space Mono',monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
  body{background:var(--papel);color:var(--negro);font-family:var(--sans);line-height:1.5;padding-bottom:104px;overflow-x:hidden}
  .wrap{max-width:640px;margin:0 auto;padding:0 24px}
  .mono{font-family:var(--mono);text-transform:uppercase;letter-spacing:.14em}

  .progreso{position:fixed;top:0;left:0;right:0;height:3px;z-index:20;background:transparent}
  .progreso i{display:block;height:100%;width:0;background:var(--oro);transition:width .1s linear}

  /* ---------- portada ---------- */
  .nav{position:relative;z-index:5;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;
       width:100%;max-width:640px;margin:0 auto;padding:16px 24px 18px}
  .logo{display:flex;align-items:center;gap:10px;color:#fff}
  .logo i{width:32px;height:32px;border-radius:9px;background:var(--oro);display:grid;place-items:center;flex:0 0 32px}
  .logo i::before{content:"";width:16px;height:10px;background:var(--negro);border-radius:2px;box-shadow:0 7px 0 -3px var(--negro)}
  .logo b{font-family:var(--disp);font-weight:800;font-size:15px;letter-spacing:-.01em;display:block;line-height:1}
  .logo s{display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.2em;color:var(--oro);text-decoration:none;margin-top:3px}

  .hero{position:relative;min-height:auto;display:flex;flex-direction:column;overflow:hidden;background:var(--negro);
    padding-top:8px}
  .hero::before{content:"";position:absolute;top:-140px;right:-110px;width:340px;height:340px;border-radius:50%;
    background:radial-gradient(circle,rgba(232,169,60,.20),transparent 68%);pointer-events:none}
  /* la foto del cartel: SIEMPRE entera. El alto sale de la propia foto (sin recortes);
     si es muy alta, se ve completa y a los costados va la misma foto desenfocada. */
  .hero-foto{position:relative;width:100%;height:70vw;max-height:520px;overflow:hidden;background:#0d0d10;
    transition:height .35s ease}
  .hero-foto .fondo{position:absolute;inset:-40px;background-size:cover;background-position:center;
    filter:blur(30px) brightness(.42) saturate(1.15);transform:scale(1.08);opacity:0;transition:opacity .5s ease}
  .hero-foto img{position:relative;display:block;width:100%;height:100%;object-fit:contain;opacity:0;transition:opacity .5s ease}
  .hero-foto.lista img,.hero-foto.lista .fondo{opacity:1}
  .hero-foto::after{content:"";position:absolute;left:0;right:0;bottom:0;height:16%;pointer-events:none;
    background:linear-gradient(180deg,rgba(10,10,12,0),var(--negro))}
  .hero-foto.zoom{cursor:zoom-in}
  .hero-foto .lupa{z-index:2;right:max(13px,calc(50% - 307px))}
  .hero-foto+.hero-in{padding-top:6px}

  .hero-in{position:relative;z-index:2;width:100%;max-width:640px;margin:0 auto;padding:22px 24px 42px;color:#fff}
  .kick{display:inline-flex;align-items:center;gap:8px;font-family:var(--mono);font-size:10.5px;
        background:var(--oro);color:#1B1206;padding:8px 13px;border-radius:999px;letter-spacing:.14em}
  .hero h1{font-family:var(--disp);font-weight:800;line-height:.9;letter-spacing:-.035em;margin-top:16px;
           text-transform:uppercase;overflow-wrap:anywhere;hyphens:auto}
  .hero h1 span{color:var(--oro)}
  .hero .dir{margin-top:14px;font-size:15.5px;color:#D6D8DE;max-width:36ch;line-height:1.45}
  .hero-datos{display:flex;gap:24px;margin-top:22px;padding-top:18px;border-top:1px solid rgba(255,255,255,.2)}
  .hero-datos div{flex:1}
  .hero-datos dt{font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;color:var(--gris-cl)}
  .hero-datos dd{font-family:var(--disp);font-weight:800;font-size:20px;margin-top:4px;letter-spacing:-.02em}

  /* ---------- capítulo: la audiencia ---------- */
  .oscuro{background:var(--negro);color:#fff;padding:64px 0}
  .cap{font-family:var(--mono);font-size:10.5px;letter-spacing:.22em;color:var(--oro)}
  h2{font-family:var(--disp);font-weight:800;font-size:clamp(30px,8vw,42px);line-height:1;letter-spacing:-.03em;margin-top:12px}
  .bajada{margin-top:14px;font-size:16px;color:var(--gris);max-width:40ch;line-height:1.6}
  .oscuro .bajada{color:#B9BCC4}

  .contador{font-family:var(--disp);font-weight:800;font-size:clamp(62px,19vw,104px);line-height:.86;
            letter-spacing:-.05em;color:var(--oro);margin-top:26px}
  .contador-l{font-family:var(--mono);font-size:12px;letter-spacing:.2em;margin-top:10px;color:#fff}
  .barras{display:flex;align-items:flex-end;gap:5px;height:76px;margin-top:30px}
  .barras i{flex:1;background:linear-gradient(180deg,var(--oro),rgba(232,169,60,.25));border-radius:3px 3px 0 0;
            height:8%;transition:height 1s cubic-bezier(.2,.7,.3,1)}
  .barras-l{display:flex;justify-content:space-between;font-family:var(--mono);font-size:9.5px;
            letter-spacing:.12em;color:var(--gris-cl);margin-top:9px}

  .comparo{display:flex;gap:16px;align-items:center;margin-top:28px;padding:20px;
    border:1px solid var(--linea-o);border-radius:20px;background:rgba(255,255,255,.04)}
  .comparo-ic{flex:0 0 48px;color:var(--oro)}
  .comparo-ic svg{width:48px;height:30px}
  .comparo b{display:block;font-family:var(--disp);font-weight:800;font-size:18px;line-height:1.18;letter-spacing:-.02em}
  .comparo span{display:block;font-size:13.5px;color:var(--gris-cl);margin-top:6px;line-height:1.5}

  /* ---------- el número que vende ---------- */
  .precio-x{background:var(--oro);color:#1B1206;padding:60px 0}
  .precio-x .cap{color:#7A5A17}
  .precio-x .n{font-family:var(--disp);font-weight:800;font-size:clamp(72px,22vw,120px);line-height:.84;
                letter-spacing:-.05em;margin-top:14px}
  .precio-x .n small{font-size:.34em;letter-spacing:-.02em}
  .precio-x p{margin-top:16px;font-size:17px;font-weight:600;max-width:30ch;line-height:1.45}
  .precio-x .fine{margin-top:14px;font-size:13px;opacity:.72;max-width:36ch;line-height:1.5}

  /* ---------- galería grande ---------- */
  .gal{display:flex;align-items:center;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding:0 24px 6px;
       margin:26px -24px 0;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .gal::-webkit-scrollbar{display:none}
  /* El recuadro toma la proporción de cada foto (se mide al cargarla), así no quedan
     franjas negras ni se recorta nada. Hasta que carga, se ve un fondo que late:
     nunca una foto a medio pintar. */
  .gal figure{flex:0 0 auto;width:88%;max-width:520px;scroll-snap-align:center;border-radius:20px;overflow:hidden;
              position:relative;aspect-ratio:16/10;
              background:#0d0d10 linear-gradient(100deg,#141418 32%,#23232c 50%,#141418 68%) 0 0/300% 100%;
              animation:cargafoto 1.5s linear infinite}
  .gal figure.medida{animation:none;background:#0d0d10}
  @keyframes cargafoto{from{background-position:150% 0}to{background-position:-150% 0}}
  .gal img{width:100%;height:100%;object-fit:contain;display:block;
           opacity:0;transition:opacity .3s ease}
  .gal figure.medida img{opacity:1}
  .gal figure.rota{animation:none;background:#141418;cursor:default}
  .gal figure.rota::after{content:"No se pudo cargar esta foto";position:absolute;inset:0;display:grid;
           place-items:center;text-align:center;padding:0 18px;color:#8A8C93;font-size:13px}
  .gal figcaption{position:absolute;left:0;right:0;bottom:0;padding:30px 16px 15px;color:#fff;font-size:14px;
    font-weight:600;background:linear-gradient(180deg,rgba(10,10,12,0),rgba(10,10,12,.85))}
  .gal em{position:absolute;top:13px;left:13px;font-family:var(--mono);font-size:10px;letter-spacing:.12em;
    font-style:normal;background:rgba(10,10,12,.6);backdrop-filter:blur(4px);color:#fff;padding:5px 10px;border-radius:999px}

  .gal figure{cursor:zoom-in}
  .lupa{position:absolute;top:13px;right:13px;width:32px;height:32px;border-radius:50%;
    background:rgba(10,10,12,.6);backdrop-filter:blur(4px);display:grid;place-items:center;color:#fff}
  .lupa svg{width:16px;height:16px}
  .visor{position:fixed;inset:0;z-index:60;background:rgba(6,6,8,.97);display:none;
    align-items:center;justify-content:center;padding:0;touch-action:pan-y}
  .visor.abierto{display:flex}
  .visor img{max-width:100%;max-height:86svh;object-fit:contain;display:block;
    animation:aparece .22s ease both}
  @keyframes aparece{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
  .visor-x{position:absolute;top:calc(14px + env(safe-area-inset-top));right:14px;width:44px;height:44px;
    border-radius:50%;background:rgba(255,255,255,.14);border:0;color:#fff;font-size:24px;cursor:pointer;
    display:grid;place-items:center;line-height:1}
  .visor-pie{position:absolute;left:0;right:0;bottom:calc(20px + env(safe-area-inset-bottom));
    text-align:center;color:#fff;font-size:14px;padding:0 24px}
  .visor-pie b{display:block;font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--oro);margin-bottom:6px}
  .visor-f{position:absolute;top:50%;transform:translateY(-50%);width:46px;height:46px;border-radius:50%;
    background:rgba(255,255,255,.14);border:0;color:#fff;font-size:22px;cursor:pointer;display:grid;place-items:center}
  .visor-f.izq{left:12px} .visor-f.der{right:12px}

  /* ---------- modo interno: arreglar las fotos (sólo con ?interno=1 y la clave) ---------- */
  .int{margin-top:22px;border:1px solid var(--linea);border-radius:18px;padding:16px 18px;background:#fff}
  .int .et{font-family:var(--mono);font-size:10px;letter-spacing:.16em;color:#8A6A1A;
           background:#FBEFD4;display:inline-block;padding:5px 10px;border-radius:999px}
  .int p{font-size:14px;color:var(--gris);margin-top:10px;line-height:1.5;max-width:46ch}
  .int .fila{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;align-items:center}
  .int input{flex:1 1 150px;min-width:0;font:inherit;font-size:15px;padding:11px 13px;border:1px solid var(--linea);
             border-radius:11px;background:var(--papel);color:var(--negro)}
  .int button{font:inherit;font-size:14px;font-weight:700;padding:11px 16px;border:0;border-radius:11px;
              background:var(--negro);color:#fff;cursor:pointer}
  .int button.sec{background:var(--papel);color:var(--negro);border:1px solid var(--linea)}
  .int button:disabled{opacity:.5;cursor:default}
  .int .msg{margin-top:10px;font-size:13.5px;font-weight:600}
  .int .msg.mal{color:#B4341F} .int .msg.bien{color:#1E7B3A}

  .gal figure.edit{cursor:default}
  .edit-bar{position:absolute;left:0;right:0;bottom:0;z-index:3;display:flex;gap:6px;justify-content:center;
            padding:26px 10px 10px;background:linear-gradient(180deg,rgba(10,10,12,0),rgba(10,10,12,.88))}
  .edit-bar button{font:inherit;font-size:13px;font-weight:700;border:0;border-radius:999px;padding:9px 13px;
            background:rgba(255,255,255,.92);color:var(--negro);cursor:pointer;line-height:1}
  .edit-bar button.bor{background:#C93B22;color:#fff}
  .edit-bar button:disabled{opacity:.4;cursor:default}
  .gal .sumar{flex:0 0 auto;width:62%;max-width:300px;aspect-ratio:4/5;border-radius:20px;border:2px dashed var(--linea);
            background:#fff;display:grid;place-items:center;text-align:center;padding:20px;cursor:pointer;
            scroll-snap-align:center;font-size:15px;font-weight:700;color:var(--negro)}
  .gal .sumar small{display:block;font-weight:500;font-size:13px;color:var(--gris);margin-top:6px}

  /* ---------- marcas que estuvieron ---------- */
  .marcas{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:24px}
  .marca{border-radius:18px;overflow:hidden;position:relative;aspect-ratio:1;background:var(--negro2)}
  .marca img{width:100%;height:100%;object-fit:cover;display:block}
  .marca span{position:absolute;left:0;right:0;bottom:0;padding:24px 12px 12px;color:#fff;font-size:13px;font-weight:700;
    background:linear-gradient(180deg,rgba(10,10,12,0),rgba(10,10,12,.85))}

  /* ---------- ficha técnica ---------- */
  .datos{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--linea);margin-top:24px;
         border:1px solid var(--linea);border-radius:20px;overflow:hidden}
  .datos>div{background:var(--papel);padding:20px 18px}
  .datos dt{font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--gris)}
  .datos dd{font-family:var(--disp);font-weight:800;font-size:24px;letter-spacing:-.025em;margin-top:6px}
  .datos dd small{font-family:var(--sans);font-size:13px;font-weight:600;color:var(--gris);letter-spacing:0}

  .ruta{margin-top:26px}
  .ruta-linea{display:flex;align-items:center;gap:0;height:4px;border-radius:99px;overflow:hidden;background:var(--linea)}
  .ruta-linea i{flex:1;height:100%}
  .ruta-linea i:nth-child(2){background:var(--oro)}
  .ruta-paradas{display:flex;justify-content:space-between;margin-top:12px;font-family:var(--mono);
    font-size:10px;letter-spacing:.08em;color:var(--gris);text-transform:uppercase}
  .ruta-paradas b{color:var(--negro);background:var(--oro);padding:4px 9px;border-radius:999px;
    margin-top:-6px;font-size:10px}
  .link-mapa{display:inline-block;margin-top:20px;font-size:15px;font-weight:700;color:var(--negro);
    text-decoration:none;border-bottom:2px solid var(--oro);padding-bottom:2px}

  /* ---------- disponibilidad ---------- */
  .libera{background:var(--negro);color:#fff;border-radius:24px;padding:30px 24px;margin-top:24px}
  .libera .est{display:inline-flex;align-items:center;gap:8px;font-family:var(--mono);font-size:10.5px;
               letter-spacing:.16em;color:var(--oro)}
  .libera .est i{width:8px;height:8px;border-radius:50%;background:var(--oro);
                 box-shadow:0 0 0 0 rgba(232,169,60,.6);animation:lat 2.4s ease-out infinite}
  @keyframes lat{70%{box-shadow:0 0 0 12px rgba(232,169,60,0)}100%{box-shadow:0 0 0 0 rgba(232,169,60,0)}}
  .libera h3{font-family:var(--disp);font-weight:800;font-size:clamp(26px,7vw,34px);line-height:1.03;
             letter-spacing:-.03em;margin-top:14px}
  .libera h3 b{color:var(--oro)}
  .cuenta{display:flex;gap:10px;margin-top:22px}
  .cuenta div{flex:1;background:rgba(255,255,255,.07);border-radius:14px;padding:14px 10px;text-align:center}
  .cuenta b{display:block;font-family:var(--disp);font-weight:800;font-size:28px;letter-spacing:-.03em}
  .cuenta span{display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;color:var(--gris-cl);margin-top:4px}
  .libera p{margin-top:18px;font-size:14.5px;color:#B9BCC4;line-height:1.6}

  /* ---------- precio ---------- */
  .valor{margin-top:14px;border:2px solid var(--negro);border-radius:24px;padding:28px 24px;background:var(--blanco)}
  .valor .l{font-family:var(--mono);font-size:10.5px;letter-spacing:.18em;color:var(--gris)}
  .valor .v{font-family:var(--disp);font-weight:800;font-size:clamp(38px,11vw,54px);letter-spacing:-.04em;margin-top:8px;line-height:1}
  .valor .v span{font-family:var(--sans);font-size:15px;font-weight:700;color:var(--gris);letter-spacing:0}
  .valor ul{list-style:none;margin-top:18px;padding-top:16px;border-top:1px dashed var(--linea)}
  .valor li{display:flex;gap:10px;align-items:flex-start;font-size:14.5px;color:var(--gris);margin-top:9px;line-height:1.5}
  .valor li::before{content:"✓";color:var(--verde);font-weight:800;flex:0 0 auto}

  /* ---------- cierre ---------- */
  .cierre{background:var(--negro);color:#fff;padding:60px 0 70px;margin-top:56px;text-align:center}
  .cierre h2{font-size:clamp(32px,9vw,46px)}
  .cierre p{margin:16px auto 0;font-size:16px;color:#B9BCC4;max-width:34ch}
  .wa-grande{display:inline-flex;align-items:center;justify-content:center;gap:11px;margin-top:26px;
    background:var(--oro);color:#1B1206;text-decoration:none;padding:19px 30px;border-radius:999px;
    font-size:17.5px;font-weight:800;box-shadow:0 14px 34px rgba(232,169,60,.28)}
  .wa-grande svg{width:22px;height:22px}
  .compartir{display:inline-flex;align-items:center;gap:8px;margin-top:18px;color:#fff;text-decoration:none;
    border:1px solid rgba(255,255,255,.28);border-radius:999px;padding:12px 20px;font-size:14px;font-weight:600;background:none;cursor:pointer;font-family:inherit}

  /* ---------- barra fija ---------- */
  .cta{position:fixed;left:0;right:0;bottom:0;z-index:9;padding:14px 24px calc(14px + env(safe-area-inset-bottom));
       background:linear-gradient(180deg,rgba(242,240,235,0),rgba(242,240,235,.97) 34%)}
  .cta a{display:flex;align-items:center;justify-content:center;gap:11px;max-width:592px;margin:0 auto;
    background:var(--negro);color:#fff;text-decoration:none;padding:18px;border-radius:16px;
    font-size:16.5px;font-weight:800;box-shadow:0 12px 30px rgba(10,10,12,.28)}
  .cta svg{width:21px;height:21px}

  .rev{opacity:1}
  .js .rev{opacity:0;transform:translateY(20px);transition:opacity .7s ease,transform .7s ease}
  .js .rev.in{opacity:1;transform:none}
  :focus-visible{outline:2px solid var(--oro);outline-offset:3px}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.js .rev{opacity:1;transform:none}}
  @media (min-width:660px){.datos{grid-template-columns:repeat(3,1fr)}}
</style>

<script>
(function(){
  var API="https://vdxkgywwcxluklvhzmor.supabase.co/rest/v1";
  var LLAVE="sb_publishable_Pde178b3hSbn8bjirUR9Lw_PsaJiUC_";
  var TEL="5491161112938";
  var ESTADIO=85000;

  var m=location.pathname.match(/cartel\/([^\/?#]+)/);
  var COD=(m&&m[1])||paramURL("c")||"";
  var app=document.getElementById("app");

  function paramURL(n){
    var m=new RegExp("[?&]"+n+"=([^&#]*)").exec(location.search);
    return m ? decodeURIComponent(m[1].replace(/\+/g," ")) : "";
  }
  function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
  function num(n){
    var s=String(Math.round(Number(n)||0)), r='', c=0;
    for(var i=s.length-1;i>=0;i--){ r=s[i]+r; if(++c%3===0 && i>0) r='.'+r; }
    return r;
  }
  function plata(n){ return "$"+num(n); }
  function fecha(d){ if(!d) return ""; var p=String(d).split("-");
    var mm=["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
    return Number(p[2])+" de "+mm[Number(p[1])-1]; }
  // Los nombres vienen con código, paréntesis y notas ("luz 18 a 1 am").
  // Dejamos un título corto y el resto pasa a la línea de abajo.
  function limpiarTitulo(n){
    var t=String(n||"").trim(), extras=[];
    t=t.replace(/^\s*\d+\s*[—–\-]\s*/,"");
    t=t.replace(/\(([^)]*)\)/g,function(_,x){ if(x.trim()) extras.push(x.trim()); return " "; });
    var m=t.match(/luz\s+[^,;]*/i);
    if(m){ extras.push(m[0].trim().replace(/^l/,"L")); t=t.replace(m[0]," "); }
    t=t.replace(/\s{2,}/g," ").replace(/[\s,;.\-–—]+$/,"").trim();
    return { titulo: t || String(n||""), extras: extras };
  }
  function medidaTitulo(t){
    var L=(t||"").length, base;
    if(L>52) base="clamp(23px,6.4vw,32px)";
    else if(L>38) base="clamp(27px,7.6vw,38px)";
    else if(L>26) base="clamp(33px,9.6vw,48px)";
    else if(L>15) base="clamp(42px,12.5vw,64px)";
    else base="clamp(50px,16vw,86px)";
    // que la palabra más larga entre en una línea (mayúsculas anchas: ~0,74 del tamaño por letra)
    var larga=0; String(t||"").split(/\s+/).forEach(function(p){ if(p.length>larga) larga=p.length; });
    if(larga<6) return base;
    return "min("+base+", calc((min(100vw, 640px) - 50px) / "+(larga*0.74).toFixed(2)+"))";
  }

           "3 de febrero":"Tres de Febrero","tres de febrero":"Tres de Febrero","caba":"CABA","san martin":"San Martín",

  // ---- la foto de arriba ----
  // Se muestra ENTERA: el alto del recuadro sale de la proporción de la foto, así nunca se corta el cartel.
  // A las del catálogo (y a la portada) se les sacan los bordes negros antes de mostrarlas.
  function cajaUtil(px,w,h){
    function oscura(i){ return px[i]<26&&px[i+1]<26&&px[i+2]<26; }
    function fila(y){ var n=0; for(var x=0;x<w;x++) if(oscura((y*w+x)*4)) n++; return n/w>0.94; }
    function col(x,y0,y1){ var n=0; for(var y=y0;y<=y1;y++) if(oscura((y*w+x)*4)) n++; return n/(y1-y0+1)>0.94; }
    var t=0,b=h-1,l=0,r=w-1;
    while(t<b&&fila(t)) t++;
    while(b>t&&fila(b)) b--;
    while(l<r&&col(l,t,b)) l++;
    while(r>l&&col(r,t,b)) r--;
    return {x:l,y:t,w:r-l+1,h:b-t+1};
  }
  // Dónde está la foto de verdad adentro de la imagen (sin los bordes negros del catálogo).
  function cajaDeFoto(im){
    var W=im.naturalWidth, H=im.naturalHeight, caja={x:0,y:0,w:W,h:H};
    try{
      var k=Math.min(1,240/Math.max(W,H)), cw=Math.max(2,Math.round(W*k)), ch=Math.max(2,Math.round(H*k));
      var c=document.createElement("canvas"); c.width=cw; c.height=ch;
      var x=c.getContext("2d"); x.drawImage(im,0,0,cw,ch);
      var u=cajaUtil(x.getImageData(0,0,cw,ch).data,cw,ch);
      c.width=c.height=0;
      // un pelito más adentro, para que no quede un filo oscuro
      var x0=u.x>0?u.x+1:0, y0=u.y>0?u.y+1:0, x1=u.x+u.w<cw?u.x+u.w-1:cw, y1=u.y+u.h<ch?u.y+u.h-1:ch;
      var r={x:Math.round(x0/k), y:Math.round(y0/k), w:Math.round((x1-x0)/k), h:Math.round((y1-y0)/k)};
      r.w=Math.min(r.w,W-r.x); r.h=Math.min(r.h,H-r.y);
      if(r.w*r.h>W*H*0.3 && (r.w<W-3||r.h<H-3)) caja=r;   // si casi no queda foto, mejor entera
    }catch(e){}
    return caja;
  }
  // Recorta esa parte y avisa con la dirección de la foto ya recortada.
  function recortarFoto(im,caja,listo){
    var c=document.createElement("canvas"); c.width=caja.w; c.height=caja.h;
    c.getContext("2d").drawImage(im,caja.x,caja.y,caja.w,caja.h,0,0,caja.w,caja.h);
    var fin=function(b){ c.width=c.height=0; listo(b?URL.createObjectURL(b):null); };
    if(c.toBlob) c.toBlob(fin,"image/jpeg",0.9); else fin(null);
  }

  function ponerFotoDeArriba(){
    var box=document.getElementById("heroFoto"); if(!box) return;
    var src=box.getAttribute("data-src"), tipo=box.getAttribute("data-tipo");
    var img=box.querySelector("img"), fondo=box.querySelector(".fondo"), asp=1, anchoVisto=0;
    function medir(){
      var W=box.clientWidth||window.innerWidth, H=window.innerHeight||700;
      if(W===anchoVisto) return; anchoVisto=W;
      // entera: si es muy alta para la pantalla, se ve completa y a los costados va desenfocada
      box.style.maxHeight="none";
      // en la compu la foto ocupa menos alto, para que el título se vea sin bajar
      box.style.height=Math.round(Math.min(W/asp, H*(W>700?0.56:(asp<0.8?0.62:0.7))))+"px";
    }
    function poner(url,w,h){
      asp=w/h; anchoVisto=0; medir();
      img.onload=function(){ box.classList.add("lista"); };
      img.src=url; fondo.style.backgroundImage='url("'+url+'")';
    }
    window.addEventListener("resize",medir);
    var im=new Image(); im.crossOrigin="anonymous";
    im.onload=function(){
      var W=im.naturalWidth, H=im.naturalHeight;
      var caja = tipo!=="foto" ? cajaDeFoto(im) : {x:0,y:0,w:W,h:H};
      if(caja.w===W&&caja.h===H){ poner(src,W,H); return; }
      recortarFoto(im,caja,function(u){ poner(u||src,caja.w,caja.h); });
    };
    im.onerror=function(){
      // si no se puede leer la foto, igual se muestra entera (sin sacarle los bordes)
      var i2=new Image();
      i2.onload=function(){ poner(src,i2.naturalWidth,i2.naturalHeight); };
      i2.onerror=function(){ if(box.parentNode) box.parentNode.removeChild(box); };
      i2.src=src;
    };
    im.src=src;
  }

  // ---- modo interno: arreglar las fotos sin salir de la ficha ----
  // Achica la foto antes de subirla (el teléfono saca fotos enormes).
  function achicar(file,lado){
    return new Promise(function(ok,mal){
      var fr=new FileReader();
      fr.onload=function(){
        var im=new Image();
        im.onload=function(){
          var k=Math.min(1,lado/Math.max(im.naturalWidth,im.naturalHeight));
          var w=Math.max(1,Math.round(im.naturalWidth*k)), h=Math.max(1,Math.round(im.naturalHeight*k));
          var cv=document.createElement("canvas"); cv.width=w; cv.height=h;
          cv.getContext("2d").drawImage(im,0,0,w,h);
          ok(cv.toDataURL("image/jpeg",0.82));
        };
        im.onerror=function(){ mal(new Error("foto")); };
        im.src=fr.result;
      };
      fr.onerror=function(){ mal(new Error("archivo")); };
      fr.readAsDataURL(file);
    });
  }

  function prenderInterno(c){
    var caja=document.getElementById("int"); if(!caja) return;
    var gal=document.getElementById("gal");
    var clave=null; try{ clave=sessionStorage.getItem("masa_clave")||null; }catch(e){}

    function post(accion,datos){
      return fetch("/api/masa?accion="+accion,{
        method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(datos)
      }).then(function(r){
        return r.json().catch(function(){ return {}; }).then(function(j){ return {status:r.status,ok:r.ok,j:j}; });
      });
    }
    function aviso(txt,bien){
      var m=caja.querySelector(".msg"); if(!m) return;
      m.className="msg"+(txt?(bien?" bien":" mal"):""); m.textContent=txt||"";
    }
    function salirPorClave(){
      clave=null; try{ sessionStorage.removeItem("masa_clave"); }catch(e){}
      pantallaClave("La clave no sirvió. Poné la clave del panel otra vez.");
    }

    function pantallaClave(err){
      caja.innerHTML='<span class="et">MODO INTERNO</span>'+
        '<p>Esta es la ficha tal cual la ve el cliente. Con la clave del panel vas a poder borrar una foto que esté mal, subir otras o cambiarles el orden.</p>'+
        '<div class="fila"><input id="intClave" type="password" placeholder="Clave del panel" autocomplete="current-password">'+
        '<button id="intEntrar">Entrar</button></div><div class="msg"></div>';
      if(err) aviso(err,false);
      var inp=document.getElementById("intClave"), bot=document.getElementById("intEntrar");
      function probar(){
        var v=inp.value; if(!v) return;
        bot.disabled=true; aviso("Comprobando…",true);
        post("clave-ok",{clave:v}).then(function(r){
          bot.disabled=false;
          if(r.status===401){ aviso("Esa no es la clave del panel.",false); inp.value=""; inp.focus(); return; }
          if(!r.ok){ aviso("No se pudo comprobar. Probá de nuevo.",false); return; }
          clave=v; try{ sessionStorage.setItem("masa_clave",v); }catch(e){}
          pantallaEdicion();
        }).catch(function(){ bot.disabled=false; aviso("Falló la conexión.",false); });
      }
      bot.addEventListener("click",probar);
      inp.addEventListener("keydown",function(e){ if(e.key==="Enter") probar(); });
    }

    function renumerar(){
      var figs=Array.prototype.slice.call(gal.querySelectorAll("figure"));
      figs.forEach(function(f,i){ var e=f.querySelector("em"); if(e) e.textContent=(i+1)+"/"+figs.length; });
    }
    function pintarBotones(){
      if(!gal) return;
      var figs=Array.prototype.slice.call(gal.querySelectorAll("figure"));
      figs.forEach(function(f,i){
        var vieja=f.querySelector(".edit-bar"); if(vieja) vieja.parentNode.removeChild(vieja);
        f.classList.add("edit");
        var bar=document.createElement("div"); bar.className="edit-bar";
        bar.innerHTML='<button class="mov" data-d="-1"'+(i===0?" disabled":"")+' aria-label="Ponerla antes">◀</button>'+
          '<button class="bor">Borrar</button>'+
          '<button class="mov" data-d="1"'+(i===figs.length-1?" disabled":"")+' aria-label="Ponerla después">▶</button>';
        f.appendChild(bar);
      });
      var tile=gal.querySelector(".sumar");
      if(!tile){
        tile=document.createElement("button"); tile.type="button"; tile.className="sumar";
        tile.innerHTML='＋ Agregar fotos<small>Sacala ahora o elegila del teléfono</small>';
        tile.addEventListener("click",function(){ var a=document.getElementById("intArch"); if(a) a.click(); });
      }
      gal.appendChild(tile);
      renumerar();
    }

    function borrar(f){
      var id=f.getAttribute("data-id");
      if(!id){ aviso("Esta foto no se puede borrar desde acá.",false); return; }
      if(!confirm("¿Borrar esta foto? Se saca del portal, de la ficha y de las propuestas al instante.")) return;
      aviso("Borrando…",true);
      post("borrar-foto",{clave:clave,id:id}).then(function(r){
        if(r.status===401) return salirPorClave();
        if(!r.ok){ aviso("No se pudo borrar. Probá de nuevo.",false); return; }
        f.parentNode.removeChild(f); pintarBotones();
        aviso("Foto borrada. Si querés, subí otra en su lugar.",true);
      }).catch(function(){ aviso("Falló la conexión.",false); });
    }

    var tOrden;
    function guardarOrden(){
      clearTimeout(tOrden);
      tOrden=setTimeout(function(){
        var orden=Array.prototype.slice.call(gal.querySelectorAll("figure")).map(function(f,i){
          return {id:f.getAttribute("data-id"),orden:i};
        }).filter(function(x){ return x.id; });
        if(!orden.length) return;
        aviso("Guardando el orden…",true);
        post("orden-fotos",{clave:clave,orden:orden}).then(function(r){
          if(r.status===401) return salirPorClave();
          aviso(r.ok?"Listo, ese es el orden en que las ve el cliente.":"No se pudo guardar el orden.",r.ok);
        }).catch(function(){ aviso("Falló la conexión.",false); });
      },600);
    }
    function mover(f,d){
      var figs=Array.prototype.slice.call(gal.querySelectorAll("figure"));
      var i=figs.indexOf(f), j=i+d;
      if(i<0||j<0||j>=figs.length) return;
      if(d<0) gal.insertBefore(f,figs[j]); else gal.insertBefore(figs[j],f);
      pintarBotones();
      f.scrollIntoView({block:"nearest",inline:"center"});
      guardarOrden();
    }

    function subir(lista){
      var files=Array.prototype.slice.call(lista||[]).filter(function(f){ return /^image\//.test(f.type); });
      if(!files.length) return;
      var bot=document.getElementById("intSumar"); if(bot) bot.disabled=true;
      aviso("Preparando "+files.length+(files.length===1?" foto…":" fotos…"),true);
      var listas=[];
      files.reduce(function(p,f){ return p.then(function(){
        return achicar(f,1400).then(function(d){ listas.push(d); },function(){});
      }); },Promise.resolve()).then(function(){
        if(!listas.length){ if(bot) bot.disabled=false; aviso("No se pudo leer ninguna de esas fotos.",false); return; }
        var tandas=[]; for(var i=0;i<listas.length;i+=3) tandas.push(listas.slice(i,i+3));
        var subidas=0, falló=false;
        return tandas.reduce(function(p,t){ return p.then(function(){
          if(falló) return;
          aviso("Subiendo… ("+subidas+" de "+listas.length+")",true);
          return post("agregar-fotos",{clave:clave,codigo:c.codigo,fotos:t}).then(function(r){
            if(r.status===401){ falló="clave"; return; }
            if(r.ok) subidas+=((r.j&&r.j.fotos)||t).length; else falló=true;
          });
        }); },Promise.resolve()).then(function(){
          if(falló==="clave") return salirPorClave();
          if(!subidas){ if(bot) bot.disabled=false; aviso("No se pudieron subir. Probá de nuevo.",false); return; }
          try{ sessionStorage.setItem("masa_ir_fotos","1"); }catch(e){}
          location.reload();
        });
      }).catch(function(){ if(bot) bot.disabled=false; aviso("Falló la conexión.",false); });
    }

    function pantallaEdicion(){
      caja.innerHTML='<span class="et">MODO INTERNO</span>'+
        '<p>Abajo de cada foto están los botones para moverla, borrarla o sumar otras. Lo que cambies se ve al toque en el portal, en la ficha y en las propuestas.</p>'+
        '<div class="fila"><button id="intSumar">Agregar fotos</button>'+
        '<button class="sec" id="intSalir">Verla como el cliente</button></div>'+
        '<div class="msg"></div><input type="file" id="intArch" accept="image/*" multiple hidden>';
      document.getElementById("intSumar").addEventListener("click",function(){ document.getElementById("intArch").click(); });
      document.getElementById("intArch").addEventListener("change",function(e){ subir(e.target.files); e.target.value=""; });
      document.getElementById("intSalir").addEventListener("click",function(){ location.href=location.pathname; });
      pintarBotones();
    }

    if(gal) gal.addEventListener("click",function(e){
      var b=e.target&&e.target.closest?e.target.closest(".edit-bar button"):null;
      if(!b||b.disabled) return;
      e.stopPropagation();
      var f=b.closest("figure"); if(!f) return;
      if(b.classList.contains("bor")) borrar(f); else mover(f,Number(b.getAttribute("data-d"))||0);
    });

    if(clave) pantallaEdicion(); else pantallaClave("");

    try{
      if(sessionStorage.getItem("masa_ir_fotos")){
        sessionStorage.removeItem("masa_ir_fotos");
        setTimeout(function(){ var g=document.getElementById("gal"); if(g) g.scrollIntoView({block:"center"}); },350);
      }
    }catch(e){}
  }

  // ---- la galería ----
  // Cada foto dice su propia proporción apenas carga: el recuadro se adapta a ella,
  // así entra entera y sin franjas negras al costado. Mientras tanto se ve el fondo que late.
  function prepararGaleria(){
    var figs=Array.prototype.slice.call(document.querySelectorAll(".gal figure"));
    if(!figs.length) return;
    var gal=document.getElementById("gal");
    function medir(f){
      var r=Number(f.getAttribute("data-ar"))||0; if(!r) return;
      // 90% de la tira: se asoma un pedacito de la que sigue, para que se note que hay más
      var tira=(gal?gal.clientWidth-48:(window.innerWidth||360)-48);
      var anchoMax=Math.min(tira*0.9,520);
      var altoMax=Math.min((window.innerHeight||700)*0.6,500);
      f.style.width=Math.round(Math.min(anchoMax,altoMax*r))+"px";
      f.style.aspectRatio=String(r);
      f.classList.add("medida");
    }
    figs.forEach(function(f){
      var im=f.querySelector("img"); if(!im) return;
      function fijar(w,h){ f.setAttribute("data-ar",(w/h).toFixed(4)); medir(f); }
      function listo(){
        if(!im.naturalWidth||!im.naturalHeight){ f.classList.add("medida"); f.classList.add("rota"); return; }
        // las del catálogo vienen con bordes negros pegados: se los sacamos antes de mostrarlas
        if(f.getAttribute("data-recortar")==="1" && !f.getAttribute("data-visto")){
          f.setAttribute("data-visto","1");
          var lim=new Image(); lim.crossOrigin="anonymous";
          lim.onload=function(){
            var caja=cajaDeFoto(lim);
            if(caja.w===lim.naturalWidth && caja.h===lim.naturalHeight) return fijar(caja.w,caja.h);
            recortarFoto(lim,caja,function(u){ if(u) im.src=u; fijar(caja.w,caja.h); });
          };
          lim.onerror=function(){ fijar(im.naturalWidth,im.naturalHeight); };
          lim.src=im.getAttribute("src");
          return;
        }
        fijar(im.naturalWidth,im.naturalHeight);
      }
      function falló(){ f.classList.add("medida"); f.classList.add("rota"); }
      if(im.complete) listo(); else { im.addEventListener("load",listo); im.addEventListener("error",falló); }
    });
    var t; window.addEventListener("resize",function(){
      clearTimeout(t); t=setTimeout(function(){
        Array.prototype.slice.call(document.querySelectorAll(".gal figure")).forEach(medir);
      },160);
    });
  }

  function prender(c,fotos){
    var prog=document.getElementById("prog"), tick=false;
    ponerFotoDeArriba();
    prepararGaleria();
    function alScrollear(){
      var y=window.scrollY||0;
        if(prog){ var alto=document.body.scrollHeight-window.innerHeight;
        prog.style.width=(alto>0?Math.min(100,(y/alto)*100):0)+"%"; }
      tick=false;
    }
    window.addEventListener("scroll",function(){ if(!tick){ tick=true; requestAnimationFrame(alScrollear); } },{passive:true});
    alScrollear();

    var barras=document.getElementById("barras");
    function subirBarras(){ if(!barras) return;
      Array.prototype.forEach.call(barras.children,function(b,i){
        setTimeout(function(){ b.style.height=getComputedStyle(b).getPropertyValue("--h"); }, i*70); }); }

    var cont=document.getElementById("contador"), corrido=false;
    function contar(){ if(corrido||!cont) return; corrido=true;
      var META=Number(cont.getAttribute("data-meta"))||0;
      if(!META||(window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches)) return;
      var t0=null;
      function paso(ts){ if(!t0)t0=ts; var p=Math.min(1,(ts-t0)/1600), e=1-Math.pow(1-p,3);
        cont.textContent=num(Math.round(META*e)); if(p<1) requestAnimationFrame(paso); }
      cont.textContent="0"; requestAnimationFrame(paso); }

    if("IntersectionObserver" in window){
      var io=new IntersectionObserver(function(es){es.forEach(function(x){if(x.isIntersecting){x.target.classList.add("in");io.unobserve(x.target);}});},{threshold:.14});
      document.querySelectorAll(".rev").forEach(function(el){io.observe(el);});
      if(cont){ var io2=new IntersectionObserver(function(es){es.forEach(function(x){if(x.isIntersecting){contar();subirBarras();io2.disconnect();}});},{threshold:.35});
        io2.observe(cont); }
    } else { subirBarras(); document.querySelectorAll(".rev").forEach(function(el){el.classList.add("in");}); }

    // ---- ampliar fotos ----
    var visor=document.getElementById("visor");
    if(visor){
      var vImg=document.getElementById("visorImg"), vTxt=document.getElementById("visorTxt"),
          vN=document.getElementById("visorN"), act=0;
      var fuentes=[];
      // Se vuelve a leer cada vez: en el modo interno las fotos se borran y se reordenan en vivo.
      function releerFotos(){
        fuentes=[];
        Array.prototype.slice.call(document.querySelectorAll(".gal figure")).forEach(function(f){
          var im=f.querySelector("img"); if(!im) return;
          fuentes.push({src:im.getAttribute("src"), txt:(f.querySelector("figcaption")||{}).textContent||""});
        });
      }
      releerFotos();

      function mostrar(i){
        if(!fuentes.length) return;
        act=(i+fuentes.length)%fuentes.length;
        vImg.src=fuentes[act].src; vTxt.textContent=fuentes[act].txt;
        vN.textContent="Foto "+(act+1)+" de "+fuentes.length;
      }
      function abrir(i){ mostrar(i); visor.classList.add("abierto"); document.body.style.overflow="hidden"; }
      function cerrar(){ visor.classList.remove("abierto"); document.body.style.overflow=""; }

      var gal=document.getElementById("gal");
      if(gal) gal.addEventListener("click",function(e){
        var f=e.target&&e.target.closest?e.target.closest("figure"):null;
        if(!f||!gal.contains(f)||f.classList.contains("rota")) return;
        if(e.target.closest(".edit-bar")) return;          // los botones de arreglar no abren la foto
        releerFotos();
        abrir(Array.prototype.slice.call(gal.querySelectorAll("figure")).indexOf(f));
      });
      var hf=document.getElementById("heroFoto");
      if(hf&&hf.hasAttribute("data-i")) hf.addEventListener("click",function(){ releerFotos(); abrir(Number(hf.getAttribute("data-i"))||0); });
      document.getElementById("visorX").addEventListener("click",cerrar);
      document.getElementById("visorIzq").addEventListener("click",function(e){ e.stopPropagation(); mostrar(act-1); });
      document.getElementById("visorDer").addEventListener("click",function(e){ e.stopPropagation(); mostrar(act+1); });
      visor.addEventListener("click",function(e){ if(e.target===visor||e.target===vImg) cerrar(); });
      document.addEventListener("keydown",function(e){
        if(!visor.classList.contains("abierto")) return;
        if(e.key==="Escape") cerrar();
        if(e.key==="ArrowRight") mostrar(act+1);
        if(e.key==="ArrowLeft") mostrar(act-1);
      });
      var x0=null;
      visor.addEventListener("touchstart",function(e){ x0=e.touches[0].clientX; },{passive:true});
      visor.addEventListener("touchend",function(e){
        if(x0===null) return; var dx=e.changedTouches[0].clientX-x0;
        if(Math.abs(dx)>50) mostrar(dx<0?act+1:act-1);
        x0=null;
      },{passive:true});
    }

    if(INTERNO) prenderInterno(c);

    var bc=document.getElementById("compartir");
    if(bc) bc.addEventListener("click",function(){
      var txt="Te paso este espacio: "+(c.nombre||("COD "+c.codigo))+". Ficha completa: "+location.href;
      if(navigator.share){ navigator.share({title:c.nombre||"Espacio publicitario",text:txt,url:location.href}).catch(function(){}); }
      else { window.open("https://api.whatsapp.com/send?text="+encodeURIComponent(txt),"_blank"); }
    });
  }
})();
